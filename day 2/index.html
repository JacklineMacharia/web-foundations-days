<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Setup Test</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1 class="logo">QuickNotes</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
        </nav>
        
    </header>
    <p class="p-header">📌Capture ideas before they disapper📝</p>

    <main>
        <section>
            <h2>Add a note</h2>
            <form id="note-form">
                <label for="note-input" class="form-labels">New note</label>
                <input type="text" id="note-input" class="my-inputs" placeholder="Type a note..." />
                <button type="submit" class="submit-btn">Add Note</button>
            </form>
        </section>

        <section>
            <h2>Your notes</h2>
            <p id="note-count">You have 2 notes.</p>
            <ul id="notes-list">
                <li>Revise HTML forms</li>
                <li>Push my code to GitHub</li>
            </ul>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 QuickNotes. Built during Web Foundations.</p>
    </footer>
    
</body>
</html>
