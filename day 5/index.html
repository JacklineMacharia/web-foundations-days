<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Users directory</title>
  <style>
    :root {
      --ink: #1f2933;
      --muted: #52606d;
      --paper: #f7f8fa;
      --card: #ffffff;
      --line: #d5dbe1;
      --accent: #1d6f6a;
      --accent-dark: #145652;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 2rem 1rem;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--paper);
      line-height: 1.5;
    }
    main { max-width: 42rem; margin: 0 auto; }
    h1 { margin: 0 0 1.25rem; font-size: 1.75rem; }
    .controls { display: flex; flex-wrap: wrap; gap: 1rem; align-items: end; }
    .field { display: flex; flex-direction: column; gap: 0.25rem; flex: 1 1 14rem; }
    label { font-weight: 600; }
    input, button {
      font: inherit;
      padding: 0.6rem 0.8rem;
      border-radius: 6px;
    }
    input { border: 1px solid var(--line); background: var(--card); }
    button {
      border: none;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
    }
    button:hover:not(:disabled) { background: var(--accent-dark); }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    :focus-visible { outline: 3px solid #f0b429; outline-offset: 2px; }
    #status { margin: 1rem 0; min-height: 1.5rem; color: var(--muted); }
    #status.error { color: #b42318; font-weight: 600; }
    #users-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.75rem; }
    #users-list li {
      background: var(--card);
      border: 1px solid var(--line);
      border-left: 4px solid var(--accent);
      border-radius: 6px;
      padding: 0.75rem 1rem;
    }
    #users-list h2 { margin: 0 0 0.25rem; font-size: 1.1rem; }
    #users-list p { margin: 0; color: var(--muted); }
    #users-list li.empty { border-left-color: var(--line); color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>Users directory</h1>

    <div class="controls">
      <button id="load-users" type="button">Load users</button>
      <div class="field">
        <label for="filter-input">Filter by name</label>
        <input id="filter-input" type="text" placeholder="Type a name" autocomplete="off">
      </div>
    </div>

    <p id="status" role="status" aria-live="polite"></p>
    <ul id="users-list"></ul>
  </main>

  <script src="users.js" defer></script>
</body>
</html>
